<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>后台授权 · 梦归の小站</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#fbf7fc" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#070810" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="./src/webpic-head.png" type="image/png">
    <link rel="stylesheet" href="./css/style.css?v=20261010c">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (t !== 'light' && t !== 'dark') {
                    t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                document.documentElement.dataset.theme = t;
            } catch (e) { }
        })();
    </script>
</head>
<body class="auth-body">

<div class="bg" aria-hidden="true">
    <div class="bg-aurora"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
    <div class="bg-grid"></div>
    <div class="bg-noise"></div>
</div>

<main class="auth-card glass sheen" id="login-container">
    <div class="auth-badge" style="background-image:url('./src/webpic-head.png')" role="img" aria-label="站点头像"></div>
    <h1 class="auth-title">Console Login</h1>
    <p class="auth-sub">&gt; authentication required</p>

    <form id="login-form" autocomplete="off">
        <div class="field">
            <label class="sr-only" for="admin-pwd" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">管理员密钥</label>
            <input type="password" id="admin-pwd" placeholder="请输入管理员密钥" autocomplete="current-password" autofocus required>
            <button type="button" class="eye" id="toggle-eye" aria-label="显示 / 隐藏密钥">
                <svg class="i-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="i-eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M3 3l18 18M10.6 10.6a3 3 0 0 0 4.2 4.2"/><path d="M9.4 5.3A10.6 10.6 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.2 6.2A17 17 0 0 0 2 12s3.5 7 10 7c1 0 1.9-.1 2.7-.3"/></svg>
            </button>
        </div>
        <button class="btn btn-primary auth-btn" id="login-btn" type="submit">进 入</button>
        <p class="auth-msg" id="auth-msg" role="status" aria-live="polite"></p>
    </form>

    <p class="auth-foot">密钥只保存在本地会话中 · <a href="index.html">返回首页</a></p>
</main>

<script>
    (function () {
        var input = document.getElementById('admin-pwd');
        var eye = document.getElementById('toggle-eye');
        var form = document.getElementById('login-form');
        var btn = document.getElementById('login-btn');
        var msg = document.getElementById('auth-msg');

        function say(text, kind) {
            msg.textContent = text || '';
            msg.className = 'auth-msg' + (kind ? ' is-' + kind : '');
        }

        eye.addEventListener('click', function () {
            var show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            eye.querySelector('.i-eye-off').hidden = show;
            eye.querySelector('.i-eye-on').hidden = !show;
            input.focus();
        });

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            var password = input.value.trim();
            if (!password) { say('请输入密钥。', 'error'); input.focus(); return; }

            btn.disabled = true;
            btn.textContent = '验证中…';
            say('正在与服务器校验…');

            try {
                var fd = new FormData();
                fd.append('action', 'login');
                fd.append('password', password);
                var res = await fetch('./api.php', { method: 'POST', body: fd });
                var data = await res.json().catch(function () { return {}; });

                if (res.ok && data.success && data.sid) {
                    // 只把服务器发的会话 id 存进浏览器，密码本身不落盘
                    sessionStorage.setItem('sfmb_sid', data.sid);
                    if (data.expires) sessionStorage.setItem('sfmb_sid_exp', String(data.expires));
                    say('身份确认，正在跳转…', 'ok');
                    setTimeout(function () { window.location.href = 'console.html'; }, 500);
                    return;
                }

                if (res.status === 429) {
                    var mins = Math.ceil((data.retry_after || 0) / 60);
                    say('失败次数过多，请 ' + mins + ' 分钟后再试。', 'error');
                } else if (data.error === 'Server not configured') {
                    say('服务端还没配置密钥指纹（config.php 里的 $EXPECTED_HASH）。', 'error');
                } else {
                    say('密钥不正确，请重试。', 'error');
                }
            } catch (err) {
                say('无法连接服务器，请检查 PHP 环境是否正常。', 'error');
            }

            btn.disabled = false;
            btn.textContent = '进 入';
            input.select();
        });
    })();
</script>
</body>
</html>
