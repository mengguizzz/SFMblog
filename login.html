<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台授权 - 梦归の小站</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" href="./src/webpic-head.png" type="image/png">
    <style>
        body { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
            overflow: hidden;
        }

        .login-card {
            padding: 40px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .login-title {
            font-size: 1.8rem;
            color: var(--text-primary);
            margin-bottom: 30px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group input {
            width: 100%;
            padding: 15px 45px 15px 20px;
            border: 2px solid var(--glass-border-dark);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            font-size: 1.1rem;
            color: var(--text-primary);
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .input-group input:focus {
            border-color: #db2777;
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(219, 39, 119, 0.2);
        }

        .toggle-pwd {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 1.2rem;
            user-select: none;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .toggle-pwd:hover { opacity: 1; }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #db2777, #7c3aed);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(219, 39, 119, 0.4);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(219, 39, 119, 0.6);
        }
    </style>
</head>
<body>

    <div class="login-card liquid-glass" id="login-container">
        <h2 class="login-title">Console Login</h2>
        
        <div class="input-group">
            <input type="password" id="admin-pwd" placeholder="请输入管理员密钥" autocomplete="off" autofocus>
            <span class="toggle-pwd" id="toggle-eye" title="显示/隐藏密码">👁️</span>
        </div>
        
        <button class="login-btn" id="login-btn">进 入</button>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const currentTheme = localStorage.getItem('theme');
            if (currentTheme === 'dark') {
                document.body.classList.add('dark-mode');
            }
        });
    </script>

    <script>
        const pwdInput = document.getElementById('admin-pwd');
        const toggleEye = document.getElementById('toggle-eye');
        const loginBtn = document.getElementById('login-btn');
        const loginContainer = document.getElementById('login-container');

        toggleEye.addEventListener('click', () => {
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                toggleEye.innerText = '🙈';
            } else {
                pwdInput.type = 'password';
                toggleEye.innerText = '👁️';
            }
        });

        function doLogin() {
            const password = pwdInput.value.trim();
            if (!password) {
                alert('请输入密钥！');
                return;
            }
            
            sessionStorage.setItem('admin_token', password);
            
            loginContainer.innerHTML = '<h3 style="color: #db2777; margin: 20px 0;">身份确认中，正在跳转...</h3>';
            setTimeout(() => {
                window.location.href = 'console.html';
            }, 600);
        }

        loginBtn.addEventListener('click', doLogin);
        
        pwdInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                doLogin();
            }
        });
    </script>
</body>
</html>
