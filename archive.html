<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>归档 · SFMblog 演示站</title>
    <meta name="description" content="SFMblog 演示站的全部文章归档，按年份时间轴排列。">
    <meta name="theme-color" content="#fdf1f7">
    <link rel="icon" href="./src/webpic-head.png" type="image/png">
    <link rel="stylesheet" href="./css/style.css?v=20261056a">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (t !== 'light' && t !== 'dark') {
                    // 没手动切过时按系统时间定：白天(7:00-19:00)浅色，其余深色
                    var h = new Date().getHours();
                    t = (h >= 7 && h < 19) ? 'light' : 'dark';
                }
                document.documentElement.dataset.theme = t;
            } catch (e) { }
        })();
    </script>
</head>
<body>

<a class="skip-link" href="#main">跳到主要内容</a>

<div class="bg" aria-hidden="true">
    <div class="bg-aurora"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
    <div class="bg-grid"></div>
    <div class="bg-noise"></div>
</div>

<header class="nav-wrap" id="nav-wrap">
    <nav class="nav glass" aria-label="主导航">
        <a class="nav-brand" href="index.html">
            <span class="nav-avatar" style="background-image:url('./src/webpic-head.png')" role="img" aria-label="站点头像"></span>
            <span class="nav-name">SFMblog<span class="accent">.</span></span>
        </a>
        <div class="nav-links" id="nav-links">
            <a href="index.html">首页</a>
            <a href="archive.html" class="active" aria-current="page">归档</a>
            <a href="about.html">关于</a>
        </div>
        <div class="nav-actions">
            <button class="icon-btn theme-toggle" id="theme-toggle" type="button" aria-label="切换深色 / 浅色模式">
                <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79Z"/></svg>
                <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
            <button class="icon-btn nav-burger" id="nav-burger" type="button" aria-label="展开菜单" aria-expanded="false" aria-controls="nav-links">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>
</header>

<main class="main" id="main">
    <div class="section-head" data-reveal>
        <div>
            <span class="kicker">Timeline</span>
            <h1 class="section-title">归档</h1>
            <p class="section-sub">过去折腾过的代码、填过的坑，都在这里了。</p>
        </div>
    </div>

    <div class="archive-stats" id="archive-stats"></div>

    <div class="timeline" id="archive-list-container">
        <div class="skeleton" style="height:120px"></div>
    </div>
</main>

<footer class="site-footer">
    <div class="footer-inner">
        <div class="footer-id">
            <a href="login.html" title="管理入口" aria-label="管理入口">
                <div class="footer-img" style="background-image:url('./src/webpic-foot.jpg')"></div>
            </a>
            <p class="footer-quote">“You cannot imprison the wind, just as you cannot imprison the will to be free.”</p>
        </div>
        <div class="footer-meta">
            <p>&copy; 2026 SFMblog · All rights reserved.</p>
            <p>Powered by SFMblog</p>
            <p>SFMblog 演示站 · 非商业项目</p>
        </div>
        <div>
            <div class="counter" title="全站访问量">
                <span class="pulse" aria-hidden="true"></span>
                <span>VISITS</span>
                <b id="visit-num">····</b>
            </div>
        </div>
    </div>
</footer>

<button class="to-top glass" id="to-top" type="button" aria-label="回到顶部">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
</button>

<script src="./js/blog.js?v=20261056a"></script>
</body>
</html>
