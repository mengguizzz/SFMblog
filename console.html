<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>控制台 · 梦归の小站</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="./src/webpic-head.png" type="image/png">
    <link rel="stylesheet" href="./css/style.css?v=20261025a">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
    <script>
        document.documentElement.dataset.theme = 'dark';
    </script>
</head>
<body class="console-body">

<header class="console-top">
    <div class="console-logo"><i></i>&gt;_ Console</div>

    <button class="cbtn" id="btn-drawer" type="button" title="打开文章列表">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        文章
    </button>

    <input type="text" id="post-title" class="fld-title" placeholder="文章标题">
    <input type="date" id="post-date" class="fld-date">
    <input type="text" id="post-tag" class="fld-tag" placeholder="标签（逗号分隔，如：Linux, 服务器）">

    <div class="console-spacer"></div>

    <button class="cbtn" id="btn-reset" type="button" title="清空并新建一篇">新建</button>
    <button class="cbtn" id="btn-delete" type="button" title="删除当前文章" hidden>删除</button>
    <a href="index.html" class="cbtn" title="返回首页">首页</a>
    <button class="cbtn" id="btn-logout" type="button" title="退出登录，并让这个会话立即失效">退出</button>
    <button class="cbtn cbtn-primary" id="btn-publish" type="button">发 布</button>
</header>

<div class="console-bar">
    <button class="tool" type="button" data-md="h2" title="二级标题">H2</button>
    <button class="tool" type="button" data-md="h3" title="三级标题">H3</button>
    <span class="tool-sep"></span>
    <button class="tool" type="button" data-md="bold" title="加粗 (Ctrl+B)"><b>B</b></button>
    <button class="tool" type="button" data-md="italic" title="斜体 (Ctrl+I)"><i>I</i></button>
    <button class="tool" type="button" data-md="strike" title="删除线"><s>S</s></button>
    <button class="tool" type="button" data-md="code" title="行内代码">&lt;/&gt;</button>
    <span class="tool-sep"></span>
    <button class="tool" type="button" data-md="ul" title="无序列表">•</button>
    <button class="tool" type="button" data-md="ol" title="有序列表">1.</button>
    <button class="tool" type="button" data-md="quote" title="引用">❝</button>
    <span class="tool-sep"></span>
    <button class="tool" type="button" data-md="link" title="链接 (Ctrl+K)">🔗</button>
    <button class="tool" type="button" data-md="codeblock" title="代码块">{ }</button>
    <button class="tool" type="button" data-md="table" title="表格">▦</button>
    <button class="tool" type="button" data-md="hr" title="分割线">—</button>
    <span class="tool-sep"></span>
    <button class="tool" type="button" id="btn-image" title="插入图片（也可直接 Ctrl+V 粘贴）">🖼</button>
    <input type="file" id="file-input" accept="image/*" hidden>

    <div class="console-stats">
        <span id="stat-words">0 字</span>
        <span id="stat-lines">0 行</span>
        <span id="stat-state">已同步</span>
    </div>
</div>

<main class="console-main">
    <section class="pane pane-editor">
        <div class="pane-head">Markdown</div>
        <textarea id="markdown-input" spellcheck="false" placeholder="开始用 Markdown 编写你的文章…&#10;&#10;提示：截图后直接 Ctrl + V 就能自动上传成图片链接。"></textarea>
    </section>
    <section class="pane pane-preview">
        <div class="pane-head">Preview</div>
        <div class="preview-scroll">
            <div id="markdown-preview" class="prose"></div>
        </div>
    </section>
</main>

<aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
        <div class="drawer-tabs">
            <button class="drawer-tab is-on" type="button" data-tab="posts">文章</button>
            <button class="drawer-tab" type="button" data-tab="trash">回收站</button>
        </div>
        <button class="tool" id="btn-drawer-close" type="button" aria-label="关闭">✕</button>
    </div>
    <div class="drawer-list" id="drawer-list"></div>
</aside>
<div class="scrim" id="scrim"></div>

<div class="toast-stack" id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<script src="./js/blog.js?v=20261025a"></script>
<script>
(function () {
    'use strict';

    var $ = function (id) { return document.getElementById(id); };
    var input = $('markdown-input');
    var preview = $('markdown-preview');
    var titleEl = $('post-title');
    var dateEl = $('post-date');
    var tagEl = $('post-tag');
    var publishBtn = $('btn-publish');
    var deleteBtn = $('btn-delete');

    var params = new URLSearchParams(location.search);
    var editId = params.get('edit_id');
    var isEdit = editId !== null;
    var dirty = false;
    var posts = [];

    /* ---------------- toast ---------------- */
    function toast(text, kind) {
        var el = document.createElement('div');
        el.className = 'toast ' + (kind || '');
        el.innerHTML = '<span class="bar"></span><span></span>';
        el.lastChild.textContent = text;
        $('toasts').appendChild(el);
        setTimeout(function () {
            el.classList.add('is-out');
            setTimeout(function () { el.remove(); }, 320);
        }, 2600);
    }

    /* ---------------- markdown ---------------- */
    if (window.marked) {
        marked.setOptions({ breaks: true, gfm: true });
    }

    function render() {
        if (!input.value.trim()) {
            preview.innerHTML = '<div class="preview-empty"><span><b>预览会实时显示在这里</b>在左侧写下 Markdown，右边同步看效果。</span></div>';
            return;
        }
        if (!window.marked) { preview.textContent = input.value; return; }
        preview.innerHTML = renderMarkdown(input.value || '');
        preview.querySelectorAll('pre code').forEach(function (b) {
            if (window.hljs) { try { hljs.highlightElement(b); } catch (e) { } }
        });
        preview.querySelectorAll('img').forEach(function (img) { img.loading = 'lazy'; });
    }

    function updateStats() {
        var v = input.value;
        var chars = v.replace(/\s/g, '').length;
        $('stat-words').textContent = chars + ' 字';
        $('stat-lines').textContent = (v ? v.split('\n').length : 0) + ' 行';
        $('stat-state').textContent = dirty ? '未保存' : '已同步';
        $('stat-state').style.color = dirty ? '#fbbf24' : 'rgba(255,255,255,.66)';
    }

    function markDirty() {
        dirty = true;
        updateStats();
        saveDraft();
    }

    /* ---------------- editing helpers ---------------- */
    function replaceRange(start, end, text, selStart, selEnd) {
        input.value = input.value.slice(0, start) + text + input.value.slice(end);
        input.selectionStart = selStart === undefined ? start + text.length : selStart;
        input.selectionEnd = selEnd === undefined ? input.selectionStart : selEnd;
        input.focus();
        onInput();
    }

    function wrap(before, after, placeholder) {
        var s = input.selectionStart, e = input.selectionEnd;
        var sel = input.value.slice(s, e) || placeholder || '';
        replaceRange(s, e, before + sel + after, s + before.length, s + before.length + sel.length);
    }

    function prefixLines(prefix, ordered) {
        var s = input.selectionStart, e = input.selectionEnd;
        var startLine = input.value.lastIndexOf('\n', s - 1) + 1;
        var endLine = input.value.indexOf('\n', e);
        if (endLine === -1) endLine = input.value.length;
        var block = input.value.slice(startLine, endLine);
        var out = block.split('\n').map(function (line, i) {
            return prefix + (ordered ? (i + 1) + '. ' : '') + line.replace(/^(\s*)([-*+]|\d+\.)\s+/, '$1');
        }).join('\n');
        replaceRange(startLine, endLine, out, startLine, startLine + out.length);
    }

    function insertBlock(text) {
        var s = input.selectionStart;
        var needNL = s > 0 && input.value.slice(0, s).slice(-2) !== '\n\n';
        var prefix = input.value.slice(0, s) === '' ? '' : (needNL ? '\n\n' : '\n');
        replaceRange(s, input.selectionEnd, prefix + text + '\n');
    }

    var ACTIONS = {
        h2: function () { prefixLines('## '); },
        h3: function () { prefixLines('### '); },
        bold: function () { wrap('**', '**', '加粗文字'); },
        italic: function () { wrap('*', '*', '斜体文字'); },
        strike: function () { wrap('~~', '~~', '删除线'); },
        code: function () { wrap('`', '`', 'code'); },
        link: function () {
            var s = input.selectionStart, e = input.selectionEnd;
            var sel = input.value.slice(s, e) || '链接文字';
            replaceRange(s, e, '[' + sel + '](https://)', s + 1, s + 1 + sel.length);
        },
        codeblock: function () { insertBlock('```cpp\n' + (input.value.slice(input.selectionStart, input.selectionEnd) || '// 你的代码') + '\n```'); },
        ul: function () { prefixLines('- '); },
        ol: function () { prefixLines('', true); },
        quote: function () { prefixLines('> '); },
        hr: function () { insertBlock('---'); },
        table: function () { insertBlock('| 列 1 | 列 2 |\n| --- | --- |\n| 内容 | 内容 |'); }
    };

    document.querySelectorAll('[data-md]').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var fn = ACTIONS[btn.dataset.md];
            if (fn) { fn(); }
        });
    });

    /* ---------------- input ---------------- */
    function onInput() {
        render();
        updateStats();
    }

    input.addEventListener('input', function () {
        dirty = true;
        onInput();
        saveDraft();
    });

    input.addEventListener('keydown', function (e) {
        if (!(e.ctrlKey || e.metaKey)) return;
        var k = e.key.toLowerCase();
        if (k === 'b') { e.preventDefault(); ACTIONS.bold(); }
        else if (k === 'i') { e.preventDefault(); ACTIONS.italic(); }
        else if (k === 'k') { e.preventDefault(); ACTIONS.link(); }
        else if (k === 's') { e.preventDefault(); publish(); }
    });

    // Tab 插入缩进
    input.addEventListener('keydown', function (e) {
        if (e.key !== 'Tab') return;
        e.preventDefault();
        var s = input.selectionStart, en = input.selectionEnd;
        replaceRange(s, en, '    ');
    });

    /* ---------------- draft ---------------- */
    var DRAFT_KEY = 'sfmb_draft_v2';
    var draftTimer = null;

    function saveDraft() {
        clearTimeout(draftTimer);
        draftTimer = setTimeout(function () {
            try {
                localStorage.setItem(DRAFT_KEY, JSON.stringify({
                    t: titleEl.value, d: dateEl.value, g: tagEl.value,
                    c: input.value, id: editId, at: Date.now()
                }));
            } catch (e) { }
        }, 800);
    }

    function clearDraft() {
        try { localStorage.removeItem(DRAFT_KEY); } catch (e) { }
    }

    function restoreDraft() {
        var raw;
        try { raw = localStorage.getItem(DRAFT_KEY); } catch (e) { return false; }
        if (!raw) return false;
        var d;
        try { d = JSON.parse(raw); } catch (e) { return false; }
        if (!d || d.id !== editId || !d.c) return false;
        titleEl.value = d.t || '';
        dateEl.value = d.d || '';
        tagEl.value = d.g || '';
        input.value = d.c;
        toast('已恢复上次未发布的内容');
        return true;
    }

    /* ---------------- image upload ---------------- */
    async function uploadImage(file) {
        var token = sessionStorage.getItem(window.sfmbSessionKey || 'sfmb_sid');
        if (!token) { toast('未检测到授权，请重新登录', 'err'); return null; }
        var fd = new FormData();
        fd.append('sid', token);
        fd.append('action', 'upload');
        fd.append('image', file);
        try {
            var res = await fetch('./api.php', { method: 'POST', body: fd });
            var data = await res.json();
            if (res.ok && data.url) return data.url;
            toast(data.error || '图片上传失败', 'err');
        } catch (e) {
            toast('网络错误，图片上传失败', 'err');
        }
        return null;
    }

    input.addEventListener('paste', async function (e) {
        var items = (e.clipboardData || {}).items || [];
        for (var i = 0; i < items.length; i++) {
            var it = items[i];
            if (it.kind === 'file' && it.type.indexOf('image/') === 0) {
                e.preventDefault();
                var file = it.getAsFile();
                var ph = '\n![上传中…]()\n';
                insertBlock(ph.trim());
                var url = await uploadImage(file);
                input.value = input.value.replace(ph.trim(), url ? '![image](' + url + ')' : '> ❌ 图片上传失败');
                onInput(); markDirty();
                if (url) toast('图片已上传', 'ok');
                return;
            }
        }
    });

    $('btn-image').addEventListener('click', function () { $('file-input').click(); });
    $('file-input').addEventListener('change', async function () {
        var file = this.files && this.files[0];
        if (!file) return;
        var url = await uploadImage(file);
        if (url) { insertBlock('![image](' + url + ')'); markDirty(); toast('图片已上传', 'ok'); }
        this.value = '';
    });

    /* ---------------- drawer ---------------- */
    function openDrawer() {
        $('drawer').classList.add('is-open');
        $('drawer').setAttribute('aria-hidden', 'false');
        $('scrim').classList.add('is-on');
    }
    function closeDrawer() {
        $('drawer').classList.remove('is-open');
        $('drawer').setAttribute('aria-hidden', 'true');
        $('scrim').classList.remove('is-on');
    }
    $('btn-drawer').addEventListener('click', async function () {
        await loadList();
        openDrawer();
    });
    $('btn-drawer-close').addEventListener('click', closeDrawer);
    $('scrim').addEventListener('click', closeDrawer);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDrawer(); });

    var drawerTab = 'posts';

    document.querySelectorAll('.drawer-tab').forEach(function (tab) {
        tab.addEventListener('click', function () {
            drawerTab = tab.dataset.tab;
            document.querySelectorAll('.drawer-tab').forEach(function (t) {
                t.classList.toggle('is-on', t === tab);
            });
            loadList();
        });
    });

    async function apiCall(fields) {
        var fd = new FormData();
        fd.append('sid', sessionStorage.getItem(window.sfmbSessionKey || 'sfmb_sid') || '');
        Object.keys(fields).forEach(function (k) { fd.append(k, fields[k]); });
        var res = await fetch('./api.php', { method: 'POST', body: fd });
        var data = await res.json().catch(function () { return {}; });
        if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
        return data;
    }

    function emptyNote(html) {
        var d = document.createElement('div');
        d.className = 'drawer-empty';
        d.textContent = html;
        return d;
    }

    async function loadList() {
        var list = $('drawer-list');
        list.innerHTML = drawerTab === 'trash'
            ? '<div class="drawer-empty">读取回收站…</div>'
            : '';

        if (drawerTab === 'trash') {
            var data;
            try {
                data = await apiCall({ action: 'trash' });
            } catch (e) {
                list.innerHTML = '';
                list.appendChild(emptyNote('读取回收站失败：' + e.message));
                return;
            }
            list.innerHTML = '';
            if (!data.items.length) {
                list.appendChild(emptyNote('回收站是空的。删除的文章会先放到这里，不会立刻消失。'));
                return;
            }
            data.items.forEach(function (it) {
                var row = document.createElement('div');
                row.className = 'drawer-item';
                row.innerHTML = '<span class="idx"></span><span class="nm"></span><span class="acts"></span>';
                row.children[0].textContent = '#' + it.id;
                row.children[1].textContent = it.title + (it.deletedAt ? '  ·  ' + it.deletedAt : '');

                var acts = row.children[2];

                var bRestore = document.createElement('button');
                bRestore.type = 'button';
                bRestore.className = 'restore';
                bRestore.textContent = '恢复';
                bRestore.addEventListener('click', async function () {
                    if (!confirm('把「' + it.title + '」恢复到文章列表？')) return;
                    try {
                        await apiCall({ action: 'restore', id: it.id });
                        toast('已恢复', 'ok');
                        loadList();
                    } catch (e) {
                        toast('恢复失败：' + e.message, 'err');
                    }
                });
                acts.appendChild(bRestore);

                var bPurge = document.createElement('button');
                bPurge.type = 'button';
                bPurge.className = 'purge';
                bPurge.textContent = '彻底删除';
                bPurge.addEventListener('click', async function () {
                    if (!confirm('彻底删除「' + it.title + '」？\n\n这次是真的从 default.md 里移除，无法再恢复。\n注意：后面的文章编号会前移，已经分享出去的链接可能失效。')) return;
                    try {
                        await apiCall({ action: 'trash-purge', id: it.id });
                        toast('已彻底删除', 'ok');
                        loadList();
                    } catch (e) {
                        toast('删除失败：' + e.message, 'err');
                    }
                });
                acts.appendChild(bPurge);

                list.appendChild(row);
            });
            return;
        }

        list.innerHTML = '';
        posts = (await getAdminPosts()).filter(function (p) { return !p.deleted; });
        if (!posts.length) {
            list.appendChild(emptyNote('还没有任何文章。'));
            return;
        }
        posts.forEach(function (p) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'drawer-item' + (String(p.id) === String(editId) ? ' is-current' : '');
            b.innerHTML = '<span class="idx"></span><span class="nm"></span><span class="dt"></span>';
            b.children[0].textContent = '#' + p.id;
            b.children[1].textContent = p.title;
            b.children[2].textContent = p.date;
            b.addEventListener('click', function () {
                if (dirty && !confirm('当前修改还没保存，确定切换吗？')) return;
                location.href = 'console.html?edit_id=' + p.id;
            });
            list.appendChild(b);
        });
    }

    /* ---------------- publish / delete ---------------- */
    async function publish() {
        var title = titleEl.value.trim();
        var date = dateEl.value;
        var tag = tagEl.value.trim();
        var content = input.value;

        if (!title || !content.trim()) { toast('标题和内容不能为空', 'err'); return; }
        if (!date) { date = new Date().toISOString().slice(0, 10); dateEl.value = date; }

        var token = sessionStorage.getItem(window.sfmbSessionKey || 'sfmb_sid');
        if (!token) { toast('授权已失效，请重新登录', 'err'); setTimeout(function () { location.href = 'login.html'; }, 900); return; }

        var raw = '# ' + title + '\n<!-- DATE: ' + date + ' | TAG: ' + (tag || 'Blog') + ' -->\n\n' + content.trim();
        var fd = new FormData();
        fd.append('sid', token);
        fd.append('content', raw);
        fd.append('action', isEdit ? 'edit' : 'add');
        if (isEdit) fd.append('id', editId);

        publishBtn.disabled = true;
        publishBtn.textContent = '提交中…';

        try {
            var res = await fetch('./api.php', { method: 'POST', body: fd });
            var data = await res.json().catch(function () { return {}; });
            if (res.ok && data.success) {
                dirty = false;
                clearDraft();
                toast(isEdit ? '已保存修改' : '发布成功', 'ok');
                setTimeout(function () {
                    location.href = isEdit ? 'post.html?id=' + editId : 'index.html';
                }, 700);
                return;
            }
            toast(data.error || '操作失败，请检查密钥权限', 'err');
        } catch (e) {
            toast('网络错误，提交失败', 'err');
        }

        publishBtn.disabled = false;
        publishBtn.textContent = '发 布';
    }

    publishBtn.addEventListener('click', publish);

    deleteBtn.addEventListener('click', async function () {
        if (!confirm('确定删除这篇文章吗？\n\n它只是被打上删除标记、不再对外显示，原文还留在 default.md 里，可以随时恢复。\n其它文章的编号不会变，已经分享出去的链接不受影响。')) return;
        var token = sessionStorage.getItem(window.sfmbSessionKey || 'sfmb_sid');
        if (!token) { toast('授权已失效', 'err'); return; }
        var fd = new FormData();
        fd.append('sid', token);
        fd.append('action', 'delete');
        fd.append('id', editId);
        try {
            var res = await fetch('./api.php', { method: 'POST', body: fd });
            var data = await res.json().catch(function () { return {}; });
            if (res.ok && data.success) {
                dirty = false;
                clearDraft();
                toast('已删除', 'ok');
                setTimeout(function () { location.href = 'index.html'; }, 600);
            } else {
                toast(data.error || '删除失败', 'err');
            }
        } catch (e) { toast('网络错误', 'err'); }
    });

    $('btn-reset').addEventListener('click', function () {
        if (dirty && !confirm('当前修改还没保存，确定新建吗？')) return;
        location.href = 'console.html';
    });

    $('btn-logout').addEventListener('click', async function () {
        if (dirty && !confirm('还有未保存的修改，确定退出吗？')) return;
        try { await apiCall({ action: 'logout' }); } catch (e) { }
        try {
            sessionStorage.removeItem(window.sfmbSessionKey || 'sfmb_sid');
            sessionStorage.removeItem('sfmb_sid_exp');
            localStorage.removeItem(DRAFT_KEY);
        } catch (e) { }
        dirty = false;
        location.href = 'index.html';
    });

    window.addEventListener('beforeunload', function (e) {
        if (dirty) { e.preventDefault(); e.returnValue = ''; }
    });

    /* ---------------- boot ---------------- */
    (async function boot() {
        if (!sessionStorage.getItem(window.sfmbSessionKey || 'sfmb_sid')) {
            location.replace('login.html');
            return;
        }

        if (isEdit) {
            try {
                var all = await getAdminPosts();
                var post = all.find(function (p) { return String(p.id) === String(editId); });
                if (!post) { toast('找不到这篇文章', 'err'); return; }
                document.title = '编辑 · ' + post.title;
                titleEl.value = post.title;
                dateEl.value = post.date;
                tagEl.value = post.tags.join(', ');
                input.value = post.body;
                deleteBtn.hidden = post.deleted;
                if (post.deleted) toast('这篇已经在回收站里了，先恢复再编辑', 'err');
            } catch (e) {
                toast('加载失败：' + e.message + '，请重新登录', 'err');
                setTimeout(function () { location.href = 'login.html'; }, 1500);
                return;
            }
        } else {
            dateEl.value = new Date().toISOString().slice(0, 10);
            document.title = '新建文章 · 控制台';
        }

        var restored = restoreDraft();
        render();
        dirty = !!restored;
        updateStats();
    })();
})();
</script>
