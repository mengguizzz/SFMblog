<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章 - 梦归の小站</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" href="./src/webpic-head.png" type="image/png">
    <style>
        .post-detail-container { max-width: 800px; margin: 0 auto; padding: 40px; }
        .post-header { margin-bottom: 40px; text-align: center; }
        .post-header h1 { font-size: 2.2rem; color: #444953; margin-bottom: 15px; }
        .post-meta-info { color: #94a3b8; font-family: monospace; }
        
        .markdown-body { line-height: 1.8; color: #94a3b8; font-size: 1.1rem; }
        .markdown-body h2 { margin: 30px 0 15px 0; color: #566275; border-bottom: 2px solid rgba(219, 39, 119, 0.2); padding-bottom: 5px; display: inline-block; }
        .markdown-body p { margin-bottom: 20px; text-align: justify; }
        .markdown-body code { background: rgba(0,0,0,0.05); padding: 2px 6px; border-radius: 4px; font-family: monospace; color: #db2777; }
        .markdown-body pre { background: #1e293b; color: #e2e8f0; padding: 20px; border-radius: 12px; overflow-x: auto; margin-bottom: 20px; }
        .markdown-body pre code { background: none; color: inherit; padding: 0; }
        .markdown-body blockquote { border-left: 4px solid #db2777; padding-left: 15px; color: #64748b; background: rgba(255,255,255,0.5); border-radius: 0 8px 8px 0; margin-bottom: 20px; }
        .markdown-body img {
            max-width: 100%;
            height: auto; 
            display: block;  
            margin: 25px auto;   
            border-radius: 12px; 
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1); 
        }
        .markdown-body pre { position: relative; }

        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e2e8f0;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }
        
        .copy-btn:hover { background: rgba(255, 255, 255, 0.2); }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
</head>
<body>

    <nav class="navbar liquid-glass">
        <div class="nav-left">
            <div class="nav-avatar" style="background-image: url('./src/webpic-head.png');"></div>
            <a href="index.html" class="nav-brand">梦归の小站.</a>
        </div>
        <div class="nav-links">
            <a href="#" id="theme-toggle" title="切换黑夜/白天模式" style="font-size: 1.2rem;">🌙</a>
            <a href="index.html">首页</a>
            <a href="archive.html">归档</a>
            <a href="about.html">关于</a>
        </div>
    </nav>

    <main class="main-container">
        <article class="post-detail-container liquid-glass">
            
            <div class="post-header">
                <h1 id="post-title">加载中...</h1>
                <div class="post-meta-info" id="post-meta">DATE: -- | TAG: --</div>
            </div>
            <div class="markdown-body" id="post-content">
                ...
            </div>

        </article>
    </main>

    <footer class="site-footer">
        <div class="footer-left">
            <div class="footer-img" style="background-image: url('./src/webpic-foot.jpg');"></div>
            <span class="footer-quote">“You cannot imprison the wind, just as you cannot imprison the will to be free.”</span>
        </div>
        <div class="footer-right">
            <p>&copy; 2026 梦归. All rights reserved.</p>
            <p>Powered by 梦归の小站 Architecture.</p>
            <p><a href="https://beian.miit.gov.cn/" style="font-size: 0.85rem;
    color: #94a3b8;">皖ICP备2024071168号</a></p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <script src="./js/blog.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');

            if (postId !== null) {
                const posts = await getAllPosts();
                const post = posts.find(p => p.id === postId);
                
                if (post) {
                    document.getElementById('post-title').innerText = post.title;
                    document.getElementById('post-meta').innerText = `DATE: ${post.date} | TAG: ${post.tag}`;
                    document.getElementById('post-content').innerHTML = marked.parse(post.rawContent.replace(/^#\s+(.+)/m, '').replace(/<!--.*?-->/s, ''));
                    
                    
                    const adminToken = sessionStorage.getItem('admin_token');
                    if (adminToken) {
                        const editBtn = document.createElement('a');
                        editBtn.href = `console.html?edit_id=${post.id}`;
                        editBtn.innerText = '✏️ 编辑此文';
                        editBtn.style.cssText = 'float:right; color:#db2777; text-decoration:none; font-weight:bold; margin-top:-30px;';
                        document.getElementById('post-meta').parentNode.insertBefore(editBtn, document.getElementById('post-meta'));
                    }
                    document.querySelectorAll('pre code').forEach((block) => {
                        hljs.highlightElement(block);
                    });

                    document.querySelectorAll('.markdown-body pre').forEach((pre) => {
                        const btn = document.createElement('button');
                        btn.className = 'copy-btn';
                        btn.innerText = '复制';
                        
                        btn.addEventListener('click', () => {
                            const code = pre.querySelector('code');
                            if(code) {
                                navigator.clipboard.writeText(code.innerText).then(() => {
                                    btn.innerText = '已复制!';
                                    btn.style.color = '#10b981';
                                    setTimeout(() => { 
                                        btn.innerText = '复制'; 
                                        btn.style.color = '#e2e8f0';
                                    }, 2000);
                                }).catch(err => console.error("复制失败", err));
                            }
                        });
                        pre.appendChild(btn); 
                    });

                } else {
                    document.getElementById('post-content').innerHTML = "<p>文章加载失败，可能已被删除。</p>";
                }
            } else {
                document.getElementById('post-content').innerHTML = "<p>未找到指定文章，请从首页点击进入。</p>";
            }
        });
        
    </script>

</body>
</html>
